    rest_of_name_tooltip: <p>レコードで指定された人物の名（ファーストネーム）と、追加の名（ミドルネームなど）。</p><p>例：</p><ul><li>Winston <em>（Churchill, Winston, Sir, 1874-1965 の場合）</em></li><li>Humphrey <em>（Ward, Humphrey, Mrs., 1851-1920 の場合）</em></li></ul>
    rules_tooltip: <p>名前ソースが使用されていない場合は、条件付き必須フィールド。名前の入力を定式化するために使用される規則の指示。</p><p>この統制値リストの値は変更できます。</p><p>DACS 13.3、ISAAR (CPF) 5.4.3を参照</p>
