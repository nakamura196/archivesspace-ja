    overview: <p>これらは、バックグラウンドジョブの画面にあるさまざまなインポート機能を使って、スプレッドシートのデータを ArchivesSpace に取り込むためのテンプレートです。インポートに必要なデータは、作成するレコードの種類によって異なります。すべての行と列を埋める必要はありません。</p><p>各 CSV テンプレートには、サンプルデータの行が 1 行入っています。サンプルデータでレコードを作成するつもりがなければ、スプレッドシートをアップロードする前にサンプルデータを削除してください。<b>見出しの行は削除せず、列の追加や既存の列の並べ替えもしないでください。</b></p><p>Excel のテンプレートには、テンプレートの使い方を説明する追加の指示と、一部のセルの入力チェックが含まれています。指示と入力チェックは削除しないでください。</p>
