    description: Archivists' Toolkit 時代の EAD を ArchivesSpace にインポートすると、注記のサブレコード内にある各種 EAD タグの属性の前に、古い "ns2" 名前空間の参照が残っていることがあります。ルートの <ead> タグが "ns2" 名前空間を宣言していないため、ArchivesSpace から EAD をエクスポートするときに検証エラーになるおそれがあります。このジョブは、リソース、アーカイバルオブジェクト、デジタルオブジェクト、デジタルオブジェクトコンポーネントに付いた注記のサブレコードから、"ns2" の参照を一括で削除します。すべてのリポジトリを対象とするため、<b>システム管理者の権限を持つユーザーのみ</b>が実行できます。
