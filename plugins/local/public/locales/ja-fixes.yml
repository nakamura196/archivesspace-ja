    title_tooltip: <p>受入記録またはリソースに割り当てられたタイトル。受入記録のタイトルは、リソースのタイトルと同じである必要はありません。さらに、タイトルは、受入記録がリンクされているリソースレコードから暗黙的に継承され得るので、受入記録のために表現される必要はない。 </p><p>DACS 2.3.18-2.3.22、ISAD(G) 3.1.2を参照</p>
