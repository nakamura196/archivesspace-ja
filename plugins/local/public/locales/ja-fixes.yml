    accession_date_tooltip: <p>受入が行われた日付。必ずしもレコード作成時と同じ日付ではありません。 </p>
    accession_date_unknown: 不明
    accession_id: 識別子
    accession_id_tooltip: <p>特定の受入記録の内部データベース番号。 </p>
    acquisition_type: 受入方法
    acquisition_type_tooltip: <p>獲得の種類のためのカテゴリー記述子。リポジトリは、データ値のリストをカスタマイズすることができます。 </p><p>例： </p><ul><li>贈り物</li><li>購入</li><li>転送</li></ul>
    autogen_disabled: 現在の設定では、入力されたデータからスラッグを自動生成できません
    autogen_repo_slug: スラッグが手動で入力されなかったため、リポジトリの短縮名からリポジトリのスラッグを自動生成しました
    condition_description: 状態記述
    condition_description_tooltip: <p>特別な取扱い要件を含む、受入資料の物理的状態に関する記述。 </p><p>例： </p><p>ボックス4の地図は脆く、いくつかはカビに覆われています。処理中に防護マスクを着用してください。 </p>
    content_description_tooltip: <p>受入資料の文書の種類とトピック内容の説明。 </p><p>DACS 3.1.4-3.1.7、ISAD(G) 3.3.1を参照</p><p>例： </p><p>フィールド注記、日記、地図の草案を含む10カートンの素材で、Smith氏の10年間の住居をオテイメサ牧場で記録しています。 </p>
    create_time: 作成日時
    created_by: 作成者
    disposition: 処置
    disposition_tooltip: <p>特定の受入資料がどのように異なるリソースに割り当てられたかを記述する注記。 </p><p>例： </p><p>写真は分離され、写真025に割り当てられた。 </p><p>ウィリアム・コルトン（William Colton）への手紙は、ウィリアム・コルトン（William Colton）の対応コレクションに追加され、地方の流れの地図は、郡の川のコレクションの記録に追加されました。 </p>
    general_note: 一般注記
    general_note_tooltip: <p>より詳細に定義されたフィールドのいずれにも当てはまらない情報については、この包括的な注記フィールドに記録します。 </p>
    id_0: 識別子
    id_0_tooltip: <p>必須フィールド：リポジトリ内の受入の一意の識別子。 </p><p>ArchivesSpaceでは、受入識別子をその構成部分に解析するための4つのフィールドが用意されています。各セグメントは、50文字に制限されています。識別子の合計文字数は200文字です。少なくとも最初の部分は、有効な受入記録に使用する必要があります。 </p><p>既定値を使用して、すべての受入番号で同じ構成部分を移入することができます。 </p><p>DACS 5.2.5、ISAD(G) 3.2.4を参照</p>
    id_1: 識別子2
    id_2: 識別子3
    id_3: 識別子4
    identifier: 識別子
    inventory_tooltip: <p>受入資料を構成するコンテナとその内容のリスト。ボックスリストは、フィールドで構成したり、フィールドにコピーして貼り付けたり、外部文書として参照したりすることができます。外部文書への参照は、ここまたは外部文書サブレコードに記録することができます。 </p><p>例： </p><ul><li>ボックス1：日記</li><li>ボックス2：スミス氏の家族への手紙</li><li>ボックス3：牧場従業員の個人記録</li><li>ボックス4：牧場地図の下書き</li></ul>
    is_slug_auto: スラッグを自動生成しますか？
